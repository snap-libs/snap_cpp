name: C++ Multi-Platform Build & Auto Release CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4

      - name: Build C++ Engine (Windows)
        run: |
          cd snap_cpp
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Package Windows Artifact
        run: |
          mkdir -p dist/windows-x64
          cp snap_cpp/build/Release/snap_cpp.dll dist/windows-x64/
          cp snap_cpp/build/Release/snap_cpp.lib dist/windows-x64/
          cd dist
          Compress-Archive -Path windows-x64 -DestinationPath snap_cpp-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap_cpp-windows-x64.zip
          path: snap_cpp/dist/snap_cpp-windows-x64.zip

  build-linux:
    name: Build Linux x64 (AMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4

      - name: Build C++ Engine (Linux)
        run: |
          cd snap_cpp
          mkdir -p build_linux
          cd build_linux
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Package Linux Artifact
        run: |
          mkdir -p snap_cpp/dist/linux-x64
          cp snap_cpp/build_linux/libsnap_cpp.so snap_cpp/dist/linux-x64/
          cd snap_cpp/dist
          tar -czvf snap_cpp-linux-x64.tar.gz linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap_cpp-linux-x64.tar.gz
          path: snap_cpp/dist/snap_cpp-linux-x64.tar.gz

  build-macos:
    name: Build macOS (Apple Silicon / Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout Private Core Repo
        uses: actions/checkout@v4

      - name: Setup Ninja (macOS)
        run: |
          brew install ninja

      - name: Build C++ Engine (macOS)
        run: |
          cd snap_cpp
          mkdir -p build_mac
          cd build_mac
          cmake -DCMAKE_BUILD_TYPE=Release -GNinja ..
          ninja

      - name: Package macOS Artifact
        run: |
          mkdir -p snap_cpp/dist/macos
          cp snap_cpp/build_mac/libsnap_cpp.dylib snap_cpp/dist/macos/
          cd snap_cpp/dist
          tar -czvf snap_cpp-macos.tar.gz macos

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap_cpp-macos.tar.gz
          path: snap_cpp/dist/snap_cpp-macos.tar.gz

  publish-release:
    name: Publish Multi-Platform Release Assets
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Display Downloaded Assets
        run: ls -la release_assets/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SNAP C++ Multi-Platform Release v1.0.${{ github.run_number }}
          body: |
            ## SNAP C++ Multi-Platform Compiled Engine Release

            Prebuilt C++ inference engine binaries for Windows, Linux AMD, and macOS.

            - **Windows x64**: `snap_cpp-windows-x64.zip` (`snap_cpp.dll`, `snap_cpp.lib`)
            - **Linux AMD x64**: `snap_cpp-linux-x64.tar.gz` (`libsnap_cpp.so`)
            - **macOS (Universal)**: `snap_cpp-macos.tar.gz` (`libsnap_cpp.dylib`)
          files: |
            release_assets/snap_cpp-windows-x64.zip/snap_cpp-windows-x64.zip
            release_assets/snap_cpp-linux-x64.tar.gz/snap_cpp-linux-x64.tar.gz
            release_assets/snap_cpp-macos.tar.gz/snap_cpp-macos.tar.gz
